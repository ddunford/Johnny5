# Johnny 5 — base compose.
#
# Production-shaped defaults. Dev conveniences (live source mount, --reload,
# dev image) live in docker-compose.override.yml, which Compose auto-loads ONLY
# when no explicit -f set is given. The control script (./ctl.sh) drives both:
#   dev :  docker compose ...                              (base + override)
#   prod:  docker compose -f docker-compose.yml -f docker-compose.production.yml ...
#
# Services: api (FastAPI), postgres (pgvector), redis. Inference lives off-box
# on inference.lan and is reached over the host's LAN DNS — no service here.

name: johnny5

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: johnny5-api:latest
    env_file: .env
    command: ["uvicorn", "johnny.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik_demosrv}"
      # API + WebSocket paths only — these must win over the SPA `/` catch-all,
      # so this router carries the higher priority. The `web` service owns `/`.
      traefik.http.routers.johnny5-api.rule: "Host(`${PUBLIC_DOMAIN:-johnny.demosrv.uk}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))"
      traefik.http.routers.johnny5-api.priority: "100"
      traefik.http.routers.johnny5-api.entrypoints: "websecure"
      traefik.http.routers.johnny5-api.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-le}"
      traefik.http.routers.johnny5-api.service: "johnny5-api"
      traefik.http.routers.johnny5-api.middlewares: "johnny5-hsts@docker"
      traefik.http.services.johnny5-api.loadbalancer.server.port: "8000"
      # HSTS at the TLS edge. Defined here on the always-on api service; the web
      # router references the same middleware. App-level security headers (CSP,
      # X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy) are set by
      # nginx on the web service — HSTS is the one header we keep at the edge.
      traefik.http.middlewares.johnny5-hsts.headers.stsSeconds: "63072000"
      traefik.http.middlewares.johnny5-hsts.headers.stsIncludeSubdomains: "true"

  # Web UI — nginx serving the Vite production build. Static only; it talks to
  # nothing internal. Traefik sends `/` here (the SPA, with try_files fallback)
  # and `/api` + `/ws` to the api service above.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: johnny5-web:latest
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik_demosrv}"
      # SPA catch-all: everything that isn't matched by the higher-priority
      # api router (i.e. not /api or /ws). Lower priority so the API/WS win.
      traefik.http.routers.johnny5-web.rule: "Host(`${PUBLIC_DOMAIN:-johnny.demosrv.uk}`)"
      traefik.http.routers.johnny5-web.priority: "1"
      traefik.http.routers.johnny5-web.entrypoints: "websecure"
      traefik.http.routers.johnny5-web.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-le}"
      traefik.http.routers.johnny5-web.service: "johnny5-web"
      traefik.http.routers.johnny5-web.middlewares: "johnny5-hsts@docker"
      traefik.http.services.johnny5-web.loadbalancer.server.port: "80"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-johnny5}"
      POSTGRES_USER: "${POSTGRES_USER:-johnny5}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johnny5} -d ${POSTGRES_DB:-johnny5}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

networks:
  # Private app/datastore network — not exposed to Traefik.
  internal:
    driver: bridge
  # Shared Traefik network (external, created outside this project).
  edge:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik_demosrv}"
