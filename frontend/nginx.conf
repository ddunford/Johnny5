# Johnny 5 — web UI server (rendered into /etc/nginx/conf.d/default.conf).
#
# Serves the static Vite build with an SPA fallback and a tight set of
# security headers. ${PUBLIC_DOMAIN} is substituted at container start
# (NGINX_ENVSUBST_FILTER=PUBLIC_DOMAIN) so only that token is replaced —
# every $nginx_variable below is left untouched.
#
# Header strategy (avoids nginx's add_header inheritance footgun): ALL headers
# are declared once at the server level and NO location re-declares add_header,
# so every response — index.html, hashed assets, SPA fallbacks, /healthz —
# carries the full set. Per-path caching is driven by the $cache_control map,
# emitted through a single server-level add_header.
#
# HSTS is intentionally NOT set here: it belongs at the TLS edge and is applied
# by the Traefik `johnny5-hsts` middleware on the public router.

# Hashed build assets are immutable (Vite fingerprints filenames); everything
# else (index.html and SPA-fallback routes) must never be cached so new
# deploys are picked up immediately.
map $uri $cache_control {
    default                                                            "no-cache";
    ~*\.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif|map)$  "public, max-age=31536000, immutable";
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Security headers — declared once, apply to every response ------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss://${PUBLIC_DOMAIN}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-Frame-Options        "DENY"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control          $cache_control                     always;

    # ---- Compression ----------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # ---- Container healthcheck (NOT the app's /api/health) --------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- SPA: serve the file if it exists, else fall back to index.html -
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve hidden/dotfiles.
    location ~ /\. {
        deny all;
    }
}
