[project]
name = "johnny5"
version = "0.0.0"
description = "Johnny 5 — a persistent, continuously-running synthetic being with an inner life."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Application monolith with several top-level packages. The Core/Mind boundary
# (SPEC §9.0 / FC-1) is structural: `core` is the immutable trust boundary,
# `brain` is the self-modifiable Mind, `foundation` is shared infra both depend
# on, and `johnny` is the running host (ASGI app + API surface).
[tool.hatch.build.targets.wheel]
packages = ["johnny", "core", "brain", "foundation", "repl"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `voice/` is a standalone Phase 7 DSP proof-of-concept, not part of the
# application package — it is exercised on its own, not linted/typed with the app.
extend-exclude = ["voice", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
